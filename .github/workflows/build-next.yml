name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
    # docs-only commits do not need a full shell matrix
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# a new push supersedes a running build for the same ref instead of queueing
# another full matrix behind it
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        # the lockfile references keeweb's git forks; the default npm config
        # forbids them
        env:
          npm_config_userconfig: /dev/null
          npm_config_allow_git: all
          npm_config_allow_remote: all
        run: npm ci --allow-git=all --allow-remote=all
      - name: Build
        run: npm run build:web
      - uses: actions/upload-artifact@v7
        with:
          name: keeweb-next-web
          path: dist/

  shell:
    name: Shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      # macos-13 (Intel) is not in the matrix: GitHub's Intel runners are
      # scarce and a queued job there blocked the whole workflow for hours.
      # macOS builds target Apple Silicon (macos-latest); Intel users can build
      # from source with the same workflow.
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - os: macos-latest
            bundles: dmg,app
          - os: windows-latest
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    # Apple code signing + notarization (requires a paid Developer ID). When
    # these repo secrets are present, Tauri signs + notarizes a Gatekeeper-clean
    # DMG; when absent, the ad-hoc sign step below re-signs so the app is still
    # launchable without a Developer ID. Harmless on Linux/Windows (unused).
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install dependencies
        env:
          npm_config_userconfig: /dev/null
          npm_config_allow_git: all
          npm_config_allow_remote: all
        run: npm ci --allow-git=all --allow-remote=all
      - name: Build web
        run: npm run build:web
      - name: Prepare native messaging host
        run: node scripts/prepare-browser-host.mjs
      - name: Build shell
        # the project-pinned tauri-cli (package.json); native build per runner,
        # so bundles land in src-tauri/target/release/bundle
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Sign macOS app (ad-hoc fallback when no Apple ID)
        # Without a Developer ID cert, tauri ships a malformed ad-hoc
        # signature that Gatekeeper rejects as "damaged". Re-sign it so the
        # only prompt is the one-time "unverified developer" (right-click ->
        # Open) bypass. Skipped automatically once APPLE_CERTIFICATE is set,
        # deferring to real signing + notarization.
        if: runner.os == 'macOS' && secrets.APPLE_CERTIFICATE == ''
        run: |
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -n1)
          DMG=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.dmg' | head -n1)
          echo "ad-hoc signing $APP"
          codesign --force --deep --sign - "$APP"
          # Tauri already packed the DMG from the (malformed) app, so rebuild
          # it from the re-signed app; otherwise the extracted app stays "damaged".
          if [ -n "$DMG" ]; then
            echo "re-packing $DMG from signed app"
            hdiutil create -volname "KeeWeb Next" -srcfolder "$APP" -ov -format UDZO "$DMG"
          fi
      - name: Test (Rust)
        if: runner.os != 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: keeweb-next-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [web, shell]
    # tags only: publish the available artifacts even when the optional macOS
    # runner is unavailable; web/Linux/Windows downloads remain useful.
    # do not gate on the shell matrix: a queued macOS runner cancels its leg
    # and GitHub marks the whole matrix cancelled; the release should still
    # carry the web, Linux and Windows downloads that did build
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.web.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect assets
        run: |
          set -e
          mkdir -p release
          # web app as one zip
          (cd artifacts/keeweb-next-web && zip -qr "$OLDPWD/release/keeweb-next-web.zip" .)
          # installer bundles keep their per-os names
          find artifacts -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
            \) -exec cp {} release/ \;
          # macOS .app arrives as a directory inside the artifact
          find artifacts -type d -name '*.app' | while read -r app; do
            name=$(basename "$app")
            (cd "$(dirname "$app")" && zip -qry "$OLDPWD/release/${name}.zip" "$name")
          done
          ls -l release
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "KeeWeb Next $GITHUB_REF_NAME" \
              --notes-file .github/release-notes.md \
              --latest
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --title "KeeWeb Next $GITHUB_REF_NAME" \
              --notes-file .github/release-notes.md \
              --latest
          fi
