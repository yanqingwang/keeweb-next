name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
    # docs-only commits do not need a full shell matrix
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# a new push supersedes a running build for the same ref instead of queueing
# another full matrix behind it
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        # the lockfile references keeweb's git forks; the default npm config
        # forbids them
        env:
          npm_config_userconfig: /dev/null
          npm_config_allow_git: all
          npm_config_allow_remote: all
        run: npm ci --allow-git=all --allow-remote=all
      - name: Build
        run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: keeweb-next-web
          path: dist/

  shell:
    name: Shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      # macos-13 (Intel) is not in the matrix: GitHub's Intel runners are
      # scarce and a queued job there blocked the whole workflow for hours.
      # macOS builds target Apple Silicon (macos-14); Intel users can build
      # from source with the same workflow.
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - os: macos-14
            bundles: dmg,app
          - os: windows-latest
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install dependencies
        env:
          npm_config_userconfig: /dev/null
          npm_config_allow_git: all
          npm_config_allow_remote: all
        run: npm ci --allow-git=all --allow-remote=all
      - name: Build web
        run: npm run build:web
      - name: Build shell
        # the project-pinned tauri-cli (package.json); native build per runner,
        # so bundles land in src-tauri/target/release/bundle
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Test (Rust)
        if: runner.os != 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: keeweb-next-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
